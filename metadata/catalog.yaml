# metadata/catalog.yaml — the single source of truth for every dataset the pipeline reads or writes.
#
# For each dataset: where it lives, its layer, the task that produces it and the tasks that read it,
# its grain and primary key, a row-count rule, and every column (type, unit, allowed values or
# range, nullability, description). src/catalog.py validates this file and renders
# DATA_DICTIONARY.md from it; the validation layer (src/quality.py) and the Airflow DAG read it too.
#
# Lineage follows the Airflow DAG, which runs the Spark engine. `pandas_engine_consumers` lists the
# stages that read a dataset directly when run_all.py runs on its default pandas engine.
#
# Rules (row counts, column ranges) may name a constant below instead of repeating a number;
# tests/test_catalog.py checks every constant against the code it mirrors.
#
# Column types are logical: string, integer, float, boolean, date (YYYY-MM-DD),
# datetime (YYYY-MM-DD HH:MM:SS, timezone-naive), time_of_day (HH:MM).

version: 1

constants:
  SIM_DAYS: 365              # config.SIM_DAYS — days of synthetic history
  INTERVALS_PER_DAY: 48      # 24 * 60 / config.INTERVAL_MINUTES
  TEST_DAYS: 30              # src.forecast.TEST_DAYS — held-out forecast window
  FUTURE_DAYS: 30            # src.forecast.FUTURE_DAYS — forecast / staffing horizon
  N_REASONS: 7               # len(src.generate_data.REASONS)
  N_SEGMENTS: 5              # len(src.generate_data.SEGMENTS)
  N_SIM_SCENARIOS: 4         # len(src.simulate.SCENARIOS)
  N_STAFFING_SCENARIOS: 4    # naive, realistic, optimized, optimized + deflection
  CONTACTS_MIN: 3500000      # raw row band — the same band tests/test_data_quality.py asserts
  CONTACTS_MAX: 5500000
  HANDLE_TIME_MIN: 30        # src.generate_data.HANDLE_TIME_MIN (seconds)
  HANDLE_TIME_MAX: 3600      # src.generate_data.HANDLE_TIME_MAX (seconds)
  TARGET_SL: 0.8             # config.TARGET_SL — answer 80% ...
  TARGET_ANSWER_SECONDS: 20  # config.TARGET_ANSWER_SECONDS — ... within 20 s
  MAX_OCCUPANCY: 0.9         # config.MAX_OCCUPANCY
  SIM_SL_TOLERANCE: 0.03     # tests/test_validation.py TOLERANCE — simulation vs Erlang C

tasks:   # in DAG order; `gates` = control dependencies (no data passes)
  generate_data: {entry: src.generate_data.main, description: "Generates one seeded year of synthetic contacts and the volume overview chart."}
  spark_etl: {entry: src.spark_etl.run, description: "Reads contacts.csv once in local Spark, writes cleaned Parquet and the aggregates later stages need."}
  validate_interim: {entry: "src.quality.gate(['raw', 'interim'])", gates: [forecast], description: "Great Expectations gate (.venv-gx): raw and interim suites; nothing downstream runs if it fails."}
  forecast: {entry: "src.forecast.main(engine='spark')", description: "Fits Prophet on the daily series (IROP days blanked), scores the held-out month, forecasts the horizon."}
  erlang_check: {entry: src.erlang._demo, gates: [optimize], description: "Re-checks the spec's verified Erlang C table; gates optimize."}
  simulate: {entry: src.simulate.main, description: "SimPy M/M/c simulation that independently checks Erlang C at four load levels."}
  optimize: {entry: "src.optimize.main(engine='spark')", description: "Erlang C staffing for every future half-hour, priced against two baselines plus IROP and deflection scenarios."}
  dashboard: {entry: "src.dashboard.main(engine='spark')", description: "BI-ready CSVs for Tableau and the self-contained Plotly dashboard."}
  validate_outputs: {entry: "src.quality.gate(['processed', 'outputs'])", gates: [build_deck], description: "Great Expectations gate (.venv-gx): processed and outputs suites, including cross-file consistency; the deck is built only if it passes."}
  build_deck: {entry: src.build_deck.main, description: "Executive deck; every number is read from the files above."}

datasets:

  # ---------------------------------------------------------------- raw
  - id: contacts
    path: data/raw/contacts.csv
    layer: raw
    format: csv
    committed: false
    produced_by: generate_data
    consumed_by: [spark_etl, validate_interim]
    pandas_engine_consumers: [forecast, optimize, dashboard]
    terminal: false
    grain: one row per inbound phone contact
    primary_key: [contact_id]
    row_count: {min: CONTACTS_MIN, max: CONTACTS_MAX}
    description: "Synthetic, seeded contact log for the ATL reservations center (git-ignored; regenerated by generate_data)."
    columns:
      - {name: contact_id, type: string, nullable: false, pattern: "^CT-[0-9]{7,}$", description: "Sequential contact id, CT- plus at least 7 digits."}
      - {name: timestamp, type: datetime, nullable: false, description: "Arrival time, to the second."}
      - {name: date, type: date, nullable: false, description: "Calendar date of the arrival."}
      - {name: interval_start, type: datetime, nullable: false, description: "Arrival time floored to its 30-minute planning interval."}
      - {name: hour, type: integer, unit: hour of day, nullable: false, min: 0, max: 23, description: "Hour of the arrival."}
      - {name: day_of_week, type: string, nullable: false, allowed: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday], description: "Weekday name of the arrival."}
      - {name: contact_reason, type: string, nullable: false, allowed: [Booking_Change, IROP_Rebooking, Refunds, SkyMiles, Baggage, Seat_Upgrade, General_Inquiry], description: "Why the customer called."}
      - {name: customer_segment, type: string, nullable: false, allowed: [General, Silver, Gold, Platinum, Diamond], description: "SkyMiles tier."}
      - {name: handle_time_seconds, type: integer, unit: seconds, nullable: false, min: HANDLE_TIME_MIN, max: HANDLE_TIME_MAX, description: "Talk plus after-call work for this contact (lognormal, clipped)."}
      - {name: irop_flag, type: boolean, nullable: false, description: "True if the contact arrived on an IROP (irregular operations) day."}
      - {name: resolved_first_contact, type: boolean, nullable: false, description: "Resolved on this contact; never true for abandoned or repeat contacts."}
      - {name: repeat_contact, type: boolean, nullable: false, description: "Follow-up to an earlier unresolved contact."}
      - {name: abandoned, type: boolean, nullable: false, description: "Caller hung up before being answered."}

  # ---------------------------------------------------------------- interim (Spark engine only)
  - id: contacts_parquet
    path: data/interim/contacts.parquet
    layer: interim
    format: parquet
    committed: false
    produced_by: spark_etl
    consumed_by: [validate_interim]
    terminal: false
    grain: one row per inbound phone contact
    primary_key: [contact_id]
    row_count: {min: CONTACTS_MIN, max: CONTACTS_MAX}
    description: "Cleaned, typed copy of contacts.csv (a directory of Parquet part files); read back inside spark_etl to build the aggregates, then validated by validate_interim."
    columns_like: contacts
    extra_columns:
      - {name: interval_index, type: integer, unit: half-hour of day, nullable: false, min: 0, max: 47, description: "Planning interval of the day derived from interval_start (hour * 2 + [minute = 30])."}

  - id: spark_daily_series
    path: data/interim/spark/daily_series.csv
    layer: interim
    format: csv
    committed: false
    produced_by: spark_etl
    consumed_by: [forecast, dashboard, validate_interim]
    terminal: false
    grain: one row per day of history
    primary_key: [ds]
    row_count: {exact: SIM_DAYS}
    description: "Daily contact totals and IROP flags (the forecast's training series and the dashboard's actuals)."
    columns:
      - {name: ds, type: date, nullable: false, description: "Calendar date."}
      - {name: y, type: integer, unit: contacts, nullable: false, min: 0, description: "Contacts that day."}
      - {name: irop_flag, type: boolean, nullable: false, description: "True if the day was an IROP day."}

  - id: spark_intraday_profile
    path: data/interim/spark/intraday_profile.csv
    layer: interim
    format: csv
    committed: false
    produced_by: spark_etl
    consumed_by: [forecast, validate_interim]
    terminal: false
    grain: one row per half-hour of the day
    primary_key: [interval_index]
    row_count: {exact: INTERVALS_PER_DAY}
    description: "Average share of a day's contacts that lands in each half-hour (fractions sum to 1)."
    columns:
      - {name: interval_index, type: integer, unit: half-hour of day, nullable: false, min: 0, max: 47, description: "Planning interval of the day."}
      - {name: interval_start, type: time_of_day, nullable: false, description: "Interval start, HH:MM."}
      - {name: fraction, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Share of a day's contacts in this interval."}

  - id: spark_interval_aht
    path: data/interim/spark/interval_aht.csv
    layer: interim
    format: csv
    committed: false
    produced_by: spark_etl
    consumed_by: [optimize, dashboard, validate_interim]
    terminal: false
    grain: one row per half-hour of the day
    primary_key: [interval_index]
    row_count: {exact: INTERVALS_PER_DAY}
    description: "Mean handle time per half-hour on normal (non-IROP) days."
    columns:
      - {name: interval_index, type: integer, unit: half-hour of day, nullable: false, min: 0, max: 47, description: "Planning interval of the day."}
      - {name: aht_seconds, type: float, unit: seconds, nullable: false, min: HANDLE_TIME_MIN, max: HANDLE_TIME_MAX, description: "Average handle time in that interval on normal days."}

  - id: spark_reason_mix
    path: data/interim/spark/reason_mix.csv
    layer: interim
    format: csv
    committed: false
    produced_by: spark_etl
    consumed_by: [dashboard, validate_interim]
    terminal: false
    grain: one row per contact reason
    primary_key: [reason]
    row_count: {exact: N_REASONS}
    description: "Contacts, average handle time and repeat rate per contact reason over the full year."
    columns:
      - {name: reason, type: string, nullable: false, allowed: [Booking_Change, IROP_Rebooking, Refunds, SkyMiles, Baggage, Seat_Upgrade, General_Inquiry], description: "Contact reason."}
      - {name: contacts, type: integer, unit: contacts, nullable: false, min: 0, description: "Contacts with this reason."}
      - {name: avg_AHT, type: float, unit: seconds, nullable: false, min: HANDLE_TIME_MIN, max: HANDLE_TIME_MAX, description: "Average handle time, rounded to 0.1 s."}
      - {name: repeat_rate, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Share of these contacts that were repeats, rounded to 4 dp."}

  - id: spark_scalars
    path: data/interim/spark/scalars.json
    layer: interim
    format: json
    committed: false
    produced_by: spark_etl
    consumed_by: [optimize, dashboard, validate_interim]
    terminal: false
    grain: one JSON object
    description: "Single-number aggregates: total contacts, IROP handle time and the app-deflectable share."
    columns:
      - {name: n_contacts, type: integer, unit: contacts, nullable: false, min: CONTACTS_MIN, max: CONTACTS_MAX, description: "Rows in the cleaned Parquet."}
      - {name: aht_irop, type: float, unit: seconds, nullable: false, min: HANDLE_TIME_MIN, max: HANDLE_TIME_MAX, description: "Mean handle time on IROP days."}
      - {name: deflectable_share, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Share of normal-day contacts whose reason the app could handle."}

  # ---------------------------------------------------------------- processed
  - id: forecast
    path: data/processed/forecast.csv
    layer: processed
    format: csv
    committed: true
    produced_by: forecast
    consumed_by: [optimize, dashboard, build_deck, validate_outputs]
    terminal: false
    grain: one row per day of the held-out test window plus the future horizon
    primary_key: [date]
    row_count: {exact: TEST_DAYS + FUTURE_DAYS}
    description: "Daily contact forecast with a 95% interval; actuals filled in for the test window."
    columns:
      - {name: date, type: date, nullable: false, description: "Forecast date (consecutive, no gaps)."}
      - {name: forecast, type: integer, unit: contacts, nullable: false, min: 0, description: "Point forecast (Prophet yhat, rounded)."}
      - {name: forecast_lower, type: integer, unit: contacts, nullable: false, min: 0, description: "Lower bound of the 95% interval (clipped at 0)."}
      - {name: forecast_upper, type: integer, unit: contacts, nullable: false, min: 0, description: "Upper bound of the 95% interval."}
      - {name: actual, type: integer, unit: contacts, nullable: true, min: 0, description: "Actual contacts on test days; empty on future days."}
      - {name: segment, type: string, nullable: false, allowed: [test, future], description: "Held-out test day or future (forecast-only) day."}

  - id: intraday_profile
    path: data/processed/intraday_profile.csv
    layer: processed
    format: csv
    committed: true
    produced_by: forecast
    consumed_by: [optimize, dashboard, validate_outputs]
    terminal: false
    grain: one row per half-hour of the day
    primary_key: [interval_index]
    row_count: {exact: INTERVALS_PER_DAY}
    description: "Intraday profile used to split each daily forecast into 48 half-hours (fractions sum to 1)."
    columns_like: spark_intraday_profile

  - id: forecast_metrics
    path: data/processed/forecast_metrics.json
    layer: processed
    format: json
    committed: true
    produced_by: forecast
    consumed_by: [build_deck, validate_outputs]
    terminal: false
    grain: one JSON object
    description: "Forecast accuracy on the held-out month, split into normal, holiday and IROP days."
    columns:
      - {name: backend, type: string, nullable: false, allowed: [prophet, sarima], description: "Model that produced the forecast."}
      - {name: mape_all, type: float, unit: percent, nullable: false, min: 0, description: "Mean absolute percentage error over every test day."}
      - {name: rmse_all, type: float, unit: contacts, nullable: false, min: 0, description: "Root mean squared error over every test day."}
      - {name: mape_normal, type: float, unit: percent, nullable: false, min: 0, description: "MAPE on normal (non-holiday, non-IROP) test days."}
      - {name: rmse_normal, type: float, unit: contacts, nullable: false, min: 0, description: "RMSE on normal test days."}
      - {name: n_test, type: integer, unit: days, nullable: false, min: 0, description: "Test days."}
      - {name: n_normal, type: integer, unit: days, nullable: false, min: 0, description: "Normal test days."}
      - {name: n_holiday, type: integer, unit: days, nullable: false, min: 0, description: "Holiday test days."}
      - {name: n_irop, type: integer, unit: days, nullable: false, min: 0, description: "IROP test days."}

  - id: staffing_plan
    path: data/processed/staffing_plan.csv
    layer: processed
    format: csv
    committed: true
    produced_by: optimize
    consumed_by: [dashboard, build_deck, validate_outputs]
    terminal: false
    grain: one row per 30-minute interval of the future horizon
    primary_key: [date, interval_index]
    row_count: {exact: FUTURE_DAYS * INTERVALS_PER_DAY}
    description: "Erlang C staffing for every future half-hour: volume, load, agents and predicted service."
    columns:
      - {name: date, type: date, nullable: false, description: "Future date."}
      - {name: interval_index, type: integer, unit: half-hour of day, nullable: false, min: 0, max: 47, description: "Planning interval of the day."}
      - {name: interval_start, type: time_of_day, nullable: false, description: "Interval start, HH:MM."}
      - {name: volume, type: float, unit: contacts, nullable: false, min: 0, description: "Forecast contacts in the interval (daily forecast x intraday fraction)."}
      - {name: aht_seconds, type: float, unit: seconds, nullable: false, min: HANDLE_TIME_MIN, max: HANDLE_TIME_MAX, description: "Expected handle time for the interval."}
      - {name: offered_load_erlangs, type: float, unit: erlangs, nullable: false, min: 0, description: "Work arriving: volume x AHT / interval length."}
      - {name: required_agents, type: integer, unit: agents, nullable: false, min: 1, description: "Fewest agents on the phones meeting the service and occupancy targets (Erlang C)."}
      - {name: scheduled_agents, type: integer, unit: agents, nullable: false, min: 1, description: "Required agents grossed up for shrinkage."}
      - {name: predicted_sl, type: float, unit: fraction, nullable: false, min: TARGET_SL, max: 1, description: "Predicted share answered within the target time at the required agents."}
      - {name: predicted_asa_seconds, type: float, unit: seconds, nullable: false, min: 0, description: "Predicted average speed of answer."}
      - {name: predicted_occupancy, type: float, unit: fraction, nullable: false, min: 0, max: MAX_OCCUPANCY, description: "Predicted share of agent time on calls."}

  - id: optimize_summary
    path: data/processed/optimize_summary.json
    layer: processed
    format: json
    committed: true
    produced_by: optimize
    consumed_by: [build_deck, validate_outputs]
    terminal: false
    grain: one JSON object
    description: "Agent-hours and cost for the optimized plan and both baselines, plus the deflection and IROP scenarios."
    columns:
      - {name: n_days, type: integer, unit: days, nullable: false, min: 1, description: "Days in the staffing horizon."}
      - {name: cost.opt_hours, type: float, unit: agent-hours, nullable: false, min: 0, description: "Scheduled agent-hours of the optimized plan."}
      - {name: cost.opt_cost, type: float, unit: USD, nullable: false, min: 0, description: "Optimized agent-hours x hourly cost."}
      - {name: cost.peak_scheduled, type: integer, unit: agents, nullable: false, min: 1, description: "Busiest half-hour's scheduled agents (the naive baseline's headcount)."}
      - {name: cost.flat_hours, type: float, unit: agent-hours, nullable: false, min: 0, description: "Naive baseline: peak headcount in every interval, 24/7."}
      - {name: cost.flat_cost, type: float, unit: USD, nullable: false, min: 0, description: "Naive baseline cost."}
      - {name: cost.saved_hours, type: float, unit: agent-hours, nullable: false, description: "Naive minus optimized agent-hours."}
      - {name: cost.saved_dollars, type: float, unit: USD, nullable: false, description: "Savings vs the naive baseline."}
      - {name: cost.pct_reduction, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Agent-hour reduction vs the naive baseline."}
      - {name: cost.block_hours, type: integer, unit: hours, nullable: false, min: 1, description: "Shift length of the realistic baseline."}
      - {name: cost.realistic_hours, type: float, unit: agent-hours, nullable: false, min: 0, description: "Realistic baseline: each shift staffed to its busiest half-hour."}
      - {name: cost.realistic_cost, type: float, unit: USD, nullable: false, min: 0, description: "Realistic baseline cost."}
      - {name: cost.realistic_saved_hours, type: float, unit: agent-hours, nullable: false, description: "Realistic minus optimized agent-hours."}
      - {name: cost.realistic_saved_dollars, type: float, unit: USD, nullable: false, description: "Savings vs the realistic baseline (the headline figure)."}
      - {name: cost.realistic_pct_reduction, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Agent-hour reduction vs the realistic baseline."}
      - {name: deflectable_share, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Share of normal-day contacts the app could handle."}
      - {name: deflection_factor, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Volume multiplier after deflection."}
      - {name: def_hours, type: float, unit: agent-hours, nullable: false, min: 0, description: "Optimized agent-hours with deflection."}
      - {name: def_saved_hours, type: float, unit: agent-hours, nullable: false, description: "Further agent-hours saved by deflection."}
      - {name: def_saved_dollars, type: float, unit: USD, nullable: false, description: "Further savings from deflection."}
      - {name: aht_irop, type: float, unit: seconds, nullable: false, min: HANDLE_TIME_MIN, max: HANDLE_TIME_MAX, description: "Handle time used for the IROP stress day."}
      - {name: irop_peak, type: integer, unit: agents, nullable: false, min: 1, description: "Peak required agents on the IROP stress day."}
      - {name: normal_peak, type: integer, unit: agents, nullable: false, min: 1, description: "Peak required agents on an average forecast day."}
      - {name: irop_day_hours, type: float, unit: agent-hours, nullable: false, min: 0, description: "Scheduled agent-hours of the IROP stress day."}
      - {name: normal_day_hours, type: float, unit: agent-hours, nullable: false, min: 0, description: "Scheduled agent-hours of an average forecast day."}
      - {name: opt_min_sl, type: float, unit: fraction, nullable: false, min: TARGET_SL, max: 1, description: "Lowest predicted service level in any interval of the plan."}
      - {name: opt_mean_occ, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Unweighted mean predicted occupancy over staffed intervals."}
      - {name: flat_occ_min, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Naive baseline's lowest interval occupancy."}
      - {name: flat_occ_mean, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Naive baseline's mean interval occupancy."}
      - {name: flat_occ_max, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Naive baseline's highest interval occupancy."}

  - id: validation
    path: data/processed/validation.csv
    layer: processed
    format: csv
    committed: true
    produced_by: simulate
    consumed_by: [build_deck, validate_outputs]
    terminal: false
    grain: one row per simulated load scenario
    primary_key: [name]
    row_count: {exact: N_SIM_SCENARIOS}
    description: "Erlang C predictions next to SimPy measurements (mean of the replications) per load scenario."
    columns:
      - {name: name, type: string, nullable: false, allowed: [low, medium, high, peak], description: "Scenario."}
      - {name: load, type: float, unit: erlangs, nullable: false, min: 0, description: "Offered load."}
      - {name: agents, type: integer, unit: agents, nullable: false, min: 1, description: "Agents simulated."}
      - {name: pred_sl, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Erlang C service level."}
      - {name: sim_sl, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Simulated service level (mean of replications)."}
      - {name: sim_sl_std, type: float, unit: fraction, nullable: false, min: 0, description: "Spread of the simulated service level across replications."}
      - {name: sim_sl_se, type: float, unit: fraction, nullable: false, min: 0, description: "Standard error of the simulated mean."}
      - {name: pred_asa, type: float, unit: seconds, nullable: false, min: 0, description: "Erlang C average speed of answer."}
      - {name: sim_asa, type: float, unit: seconds, nullable: false, min: 0, description: "Simulated average speed of answer."}
      - {name: pred_occ, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Erlang C occupancy."}
      - {name: sim_occ, type: float, unit: fraction, nullable: false, min: 0, max: 1, description: "Simulated occupancy."}
      - {name: n, type: integer, unit: contacts, nullable: false, min: 1, description: "Contacts measured across all replications."}
      - {name: reps, type: integer, unit: replications, nullable: false, min: 1, description: "Independent replications averaged."}
      - {name: sl_diff, type: float, unit: fraction, nullable: false, min: 0, max: SIM_SL_TOLERANCE, description: "|simulated - predicted| service level."}

  # ---------------------------------------------------------------- outputs
  - id: daily_volume
    path: outputs/dashboard/daily_volume.csv
    layer: output
    format: csv
    committed: true
    produced_by: dashboard
    consumed_by: [build_deck, validate_outputs]
    external_consumers: [Tableau Public dashboard]
    terminal: false
    grain: one row per day of history plus the future horizon
    primary_key: [date]
    row_count: {exact: SIM_DAYS + FUTURE_DAYS}
    description: "Daily actuals with the forecast and its 95% band, for the BI forecast chart."
    columns:
      - {name: date, type: date, nullable: false, description: "Calendar date."}
      - {name: actual, type: integer, unit: contacts, nullable: true, min: 0, description: "Actual contacts; empty on future days."}
      - {name: forecast, type: integer, unit: contacts, nullable: true, min: 0, description: "Forecast; empty before the test window."}
      - {name: lower, type: integer, unit: contacts, nullable: true, min: 0, description: "Lower 95% bound; empty before the test window."}
      - {name: upper, type: integer, unit: contacts, nullable: true, min: 0, description: "Upper 95% bound; empty before the test window."}

  - id: interval_staffing
    path: outputs/dashboard/interval_staffing.csv
    layer: output
    format: csv
    committed: true
    produced_by: dashboard
    consumed_by: [validate_outputs]
    external_consumers: [Tableau Public dashboard]
    terminal: false
    grain: one row per half-hour of the day, averaged over the horizon
    primary_key: [interval]
    row_count: {exact: INTERVALS_PER_DAY}
    description: "A typical day of the plan: mean volume, agents, service level and occupancy by half-hour."
    columns:
      - {name: interval, type: time_of_day, nullable: false, description: "Interval start, HH:MM."}
      - {name: volume, type: float, unit: contacts, nullable: false, min: 0, description: "Mean forecast contacts."}
      - {name: required, type: float, unit: agents, nullable: false, min: 1, description: "Mean required agents."}
      - {name: scheduled, type: float, unit: agents, nullable: false, min: 1, description: "Mean scheduled agents."}
